[package]
name = "winc-plugin"
description = "Local text transformation plugins for Winc."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
rhai = { version = "=1.27.0", features = ["grain", "sync", "no_module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
